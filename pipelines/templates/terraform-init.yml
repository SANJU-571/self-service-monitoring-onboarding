parameters:
  - name: serviceConnection
    type: string
  - name: tfDir
    type: string

steps:
  - task: AzureCLI@2
    displayName: terraform init (Azure Storage backend)
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        terraform -chdir=${{ parameters.tfDir }} init -input=false \
          -backend-config="resource_group_name=$(TFSTATE_RESOURCE_GROUP)" \
          -backend-config="storage_account_name=$(TFSTATE_STORAGE_ACCOUNT)" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=monitoring-onboarding.tfstate"
