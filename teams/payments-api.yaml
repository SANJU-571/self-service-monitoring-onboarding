# Onboarding request: one file per service.
# Open a pull request with this file and the pipeline creates the
# Datadog monitors and dashboard for you.

team: payments
service: payments-api
env: dev
owner: payments-team@example.com

# Who gets paged. Datadog handles: @email, @slack-<channel>, @pagerduty-<service>
notify:
  - "@payments-team@example.com"

runbook_url: https://github.com/SANJU-571/self-service-monitoring-onboarding/blob/main/docs/runbook.md

monitors:
  latency_ms:
    warning: 400
    critical: 800
  error_rate_pct:
    warning: 2
    critical: 5
  cpu_pct:
    warning: 70
    critical: 85
  no_traffic:
    enabled: true
